
name: Build LibPatcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          cd "$PROJECT"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibPatcher-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
